name: approve

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to approve"
        required: true

permissions:
  pull-requests: write

jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - run: gh pr review "$PR" --approve --repo "$GITHUB_REPOSITORY" --body "approved by bot for verification"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
